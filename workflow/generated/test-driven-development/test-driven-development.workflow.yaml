name: test-driven-development
version: 0.1
goal: Implement one feature or bug fix test-first, one behavior at a time (RED, GREEN,
  REFACTOR), and report verified results.
context_policy: fresh context per node; only the declared inputs are passed
inputs:
  feature_request:
    type: string
    from: user
    description: Feature or bug to implement, in plain words
  project_root:
    type: string
    from: user
    description: Path to the repository root inside the sandbox
  test_command:
    type: string
    from: user
    description: Full test command, for example pytest tests/ -q
  approval:
    type: string
    from: user
    description: Explicit yes or no from the user after reviewing the behavior list;
      asked at route_approval
nodes:
- id: capture_behaviors
  type: agent
  goal: Turn the feature request into an ordered list of small, testable behaviors,
    one per test.
  instructions: Read the relevant project files under project_root to learn the existing
    structure and test layout. Write one behavior per entry, ordered so each builds
    on the previous one (tracer bullets, not a pile of tests). Describe behavior and
    results, not implementation. Do not write or edit any files.
  inputs:
  - feature_request
  - project_root
  tools:
  - read_file
  - search_files
  output_schema:
    type: object
    properties:
      behaviors:
        type: array
        items:
          type: string
    required:
    - behaviors
    additionalProperties: false
  outputs:
  - behaviors
  checks:
  - schema
  - non_empty
  - no_files_written
  on_fail:
    retry: 1
    then: stop
  next:
  - to: route_approval
- id: route_approval
  type: branch
  goal: Pause for the user to approve the behavior list before any file is written.
  true: approval
  inputs:
  - behaviors
  - approval
  outputs:
  - approved_behaviors
  checks:
  - human_approved
  next:
  - to: red_test
    label: user approved
  - to: report
    label: user did not approve
- id: red_test
  type: agent
  for_each: approved_behaviors
  parallel: 1
  goal: Write one minimal failing test for this behavior and run it to confirm it
    fails for the expected reason.
  instructions: Write exactly one test that describes the behavior in item, with a
    clear name and real code (no mocks unless unavoidable). Run only that test with
    test_command scoped to it. Confirm it fails because the feature is missing, not
    because of a typo or import error. If it passes immediately, report that the test
    is wrong. Do not write production code.
  inputs:
  - item
  - project_root
  - test_command
  tools:
  - read_file
  - search_files
  - write_file
  - terminal
  output_schema:
    type: object
    properties:
      red_results:
        type: array
        items:
          type: object
          properties:
            behavior:
              type: string
            test_path:
              type: string
            test_name:
              type: string
            failure_message:
              type: string
            fails_for_expected_reason:
              type: boolean
          required:
          - behavior
          - test_path
          - test_name
          - failure_message
          - fails_for_expected_reason
          additionalProperties: false
    required:
    - red_results
    additionalProperties: false
  outputs:
  - red_results
  checks:
  - schema
  - test_failed_before_code
  - grounded_in_tool_results
  on_fail:
    retry: 1
    then: stop
  next:
  - to: verify_red
- id: verify_red
  type: code
  goal: Confirm every new test failed for the expected reason before any production
    code exists.
  script: checks/verify_red.py
  inputs:
  - red_results
  outputs:
  - red_verified
  checks:
  - schema
  - every_red_failed_for_missing_feature
  next:
  - to: green_impl
- id: green_impl
  type: agent
  for_each: red_verified
  parallel: 1
  goal: Write the simplest production code that makes this one failing test pass,
    without breaking other tests.
  instructions: 'Read the failing test named in item. Write the minimal code to pass
    it: hardcoding and duplication are allowed here. Do not add features, logging
    or refactors beyond what the test needs. Run the single test, then run the full
    test_command. If the target test still fails, fix the code, never the test.'
  inputs:
  - item
  - project_root
  - test_command
  tools:
  - read_file
  - search_files
  - patch
  - terminal
  output_schema:
    type: object
    properties:
      green_results:
        type: array
        items:
          type: object
          properties:
            behavior:
              type: string
            target_test_passed:
              type: boolean
            suite_passed:
              type: boolean
            files_changed:
              type: array
              items:
                type: string
          required:
          - behavior
          - target_test_passed
          - suite_passed
          - files_changed
          additionalProperties: false
    required:
    - green_results
    additionalProperties: false
  outputs:
  - green_results
  checks:
  - schema
  - target_test_passes
  - full_suite_no_regressions
  - grounded_in_tool_results
  on_fail:
    retry: 1
    then: stop
  next:
  - to: refactor
- id: refactor
  type: agent
  goal: Clean up duplication and names across all changed code while keeping every
    test green.
  instructions: Work only on files listed in green_results. Remove duplication, improve
    names, extract helpers, simplify expressions. Add no new behavior. After each
    change, run test_command. If anything fails, undo that change and take a smaller
    step.
  inputs:
  - green_results
  - project_root
  - test_command
  tools:
  - read_file
  - search_files
  - patch
  - terminal
  output_schema:
    type: object
    properties:
      refactor_results:
        type: object
        properties:
          changes_made:
            type: array
            items:
              type: string
          suite_passed:
            type: boolean
        required:
        - changes_made
        - suite_passed
        additionalProperties: false
    required:
    - refactor_results
    additionalProperties: false
  outputs:
  - refactor_results
  checks:
  - schema
  - suite_green_after_refactor
  on_fail:
    retry: 1
    then: stop
  next:
  - to: final_suite
- id: final_suite
  type: code
  goal: Run the full test command once more and record its exit code and output summary.
  script: checks/run_suite.py
  inputs:
  - refactor_results
  - test_command
  outputs:
  - suite_result
  checks:
  - schema
  - exit_code_zero
  next:
  - to: report
- id: report
  type: code
  goal: Assemble the final answer with what changed, what was verified, and what is
    left.
  script: checks/report.py
  inputs:
  - red_verified
  - green_results
  - refactor_results
  - suite_result
  outputs:
  - final_answer
  checks:
  - schema
