name: simplify-code
version: 0.1
goal: Review the user's recent code changes with four parallel narrow reviewers (reuse,
  quality, efficiency, altitude), resolve their findings into SAFE, CAREFUL and RISKY
  tiers, apply only the user-approved SAFE and CAREFUL fixes with test verification,
  and report the rest.
context_policy: fresh context per node; only the declared inputs are passed
inputs:
  repo_path:
    type: string
    from: user
    description: absolute path of the git repository to review
  scope:
    type: string
    from: user
    description: 'diff source: working-tree (default), staged, last-commit, branch,
      or specific file paths'
  focus:
    type: string
    from: user
    description: 'optional: reuse, quality, efficiency, altitude, or all (default
      all)'
  dry_run:
    type: boolean
    from: user
    description: true to report findings and apply nothing
nodes:
- id: capture_diff
  type: code
  goal: Capture the diff text for the requested scope and count its changed lines
    and files.
  script: checks/capture_diff.sh
  inputs:
  - repo_path
  - scope
  outputs:
  - diff_text
  - diff_stats
  checks:
  - schema
  - non_empty_diff
  on_fail:
    retry: 0
    then: stop
  next:
  - to: size_gate
- id: size_gate
  type: branch
  goal: Route large diffs to a scope confirmation before four reviewers each read
    the full diff.
  true: diff_stats
  inputs:
  - diff_stats
  outputs:
  - diff_stats
  next:
  - to: await_scope_approval
    label: more than 2000 changed lines
  - to: define_reviewers
    label: 2000 or fewer changed lines
- id: await_scope_approval
  type: code
  goal: Pause and ask the user to confirm or narrow the oversized diff before any
    reviewer runs.
  script: checks/await_approval.py
  inputs:
  - diff_stats
  - scope
  outputs:
  - scope_approved
  checks:
  - human_approved
  on_fail:
    retry: 0
    then: stop
  next:
  - to: define_reviewers
- id: define_reviewers
  type: code
  goal: Produce the list of reviewer angles to run, limited to the user's focus.
  script: checks/reviewer_angles.py
  inputs:
  - focus
  outputs:
  - reviewer_angles
  checks:
  - schema
  - at_most_four_angles
  next:
  - to: review
- id: review
  type: agent
  for_each: reviewer_angles
  parallel: 4
  goal: Review the diff for one narrow class of problem, searching the codebase for
    evidence, and report findings with file and line.
  instructions: You are one of four reviewers. Your angle is item.name and its goal
    is item.goal. Review the full diff in diff_text for only this class of problem.
    Search the codebase in repo_path with search_files and read_file before flagging
    anything. Run git blame on any line you suggest removing (Chesterton's Fence);
    if the purpose is unclear, set confidence to low. Skip nits and style-only churn.
    Each finding needs file, line, problem, cost, suggested_fix, confidence (high,
    medium, low) and risk (SAFE, CAREFUL, RISKY). SAFE means provably no behaviour
    change, CAREFUL means same semantics, RISKY means behaviour or public contract
    may change. Do not edit any files.
  inputs:
  - item
  - diff_text
  - repo_path
  tools:
  - read_file
  - search_files
  - terminal
  output_schema:
    type: object
    additionalProperties: false
    required:
    - findings
    properties:
      findings:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - file
          - line
          - problem
          - cost
          - suggested_fix
          - confidence
          - risk
          properties:
            file:
              type: string
            line:
              type: integer
            problem:
              type: string
            cost:
              type: string
            suggested_fix:
              type: string
            confidence:
              type: string
              enum:
              - high
              - medium
              - low
            risk:
              type: string
              enum:
              - SAFE
              - CAREFUL
              - RISKY
  outputs:
  - reviewer_findings
  checks:
  - schema
  - evidence_has_file_and_line
  - findings_grounded_in_search
  on_fail:
    retry: 1
    then: stop
  next:
  - to: merge_findings
- id: merge_findings
  type: code
  goal: Merge the four reviewers' findings, collapsing duplicates on the same line
    or mechanism and dropping findings with no file and line.
  script: checks/merge_findings.py
  inputs:
  - reviewer_findings
  outputs:
  - merged_findings
  checks:
  - schema
  - no_duplicate_locations
  next:
  - to: resolve_plan
- id: resolve_plan
  type: agent
  goal: Resolve conflicts between findings and sort the survivors into SAFE, CAREFUL,
    RISKY and skipped tiers, honouring the user's focus.
  instructions: 'Take merged_findings and produce a plan. Resolve conflicts in this
    order: correctness, then the user''s focus, then readability and reuse, then micro-performance.
    When two suggestions are mutually exclusive, keep the one touching less code and
    note the alternative. Verify each finding by reading the file at its line. Drop
    weak or wrong findings silently. Put SAFE items (unused imports, commented-out
    code, pass-through wrappers) in safe, CAREFUL items (renames, flattening, extracting
    helpers) in careful, and RISKY items (public API, concurrency, error handling,
    N+1 changes, altitude fixes that touch shared infrastructure) in risky. Record
    skipped items with a reason. Do not edit any files. Flag any correctness bug separately
    as bug_notes, not as a cleanup item.'
  inputs:
  - merged_findings
  - focus
  outputs:
  - plan
  tools:
  - read_file
  - search_files
  - terminal
  output_schema:
    type: object
    additionalProperties: false
    required:
    - safe
    - careful
    - risky
    - skipped
    - bug_notes
    properties:
      safe:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - file
          - line
          - fix
          - reason
          properties:
            id:
              type: string
            file:
              type: string
            line:
              type: integer
            fix:
              type: string
            reason:
              type: string
      careful:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - file
          - line
          - fix
          - reason
          properties:
            id:
              type: string
            file:
              type: string
            line:
              type: integer
            fix:
              type: string
            reason:
              type: string
      risky:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - file
          - line
          - fix
          - reason
          properties:
            id:
              type: string
            file:
              type: string
            line:
              type: integer
            fix:
              type: string
            reason:
              type: string
      skipped:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - reason
          properties:
            id:
              type: string
            reason:
              type: string
      bug_notes:
        type: array
        items:
          type: string
  checks:
  - schema
  - every_item_has_file_and_line
  - tier_matches_risk_rule
  on_fail:
    retry: 1
    then: stop
  next:
  - to: approve_plan
- id: approve_plan
  type: code
  goal: Show the plan to the user and record which SAFE and CAREFUL items they approve;
    RISKY items stay out unless the user explicitly names them.
  script: checks/await_plan_approval.py
  inputs:
  - plan
  outputs:
  - approved_plan
  checks:
  - human_approved
  - no_risky_item_auto_approved
  on_fail:
    retry: 0
    then: stop
  next:
  - to: route_after_approval
- id: route_after_approval
  type: branch
  goal: Send approved fixes to the apply step, or skip straight to the report on a
    dry run or when nothing was approved.
  true: approved_plan
  inputs:
  - approved_plan
  - dry_run
  outputs:
  - approved_plan
  next:
  - to: apply_fixes
    label: not a dry run and at least one SAFE or CAREFUL item approved
  - to: report
    label: dry run, or nothing approved
- id: apply_fixes
  type: agent
  goal: Apply the approved SAFE fixes first, then CAREFUL fixes one file at a time,
    verifying after each file and reverting any fix that breaks tests.
  instructions: Apply only items in approved_plan.safe and approved_plan.careful.
    Never apply anything in risky. Work SAFE items first. For CAREFUL items, edit
    one file at a time with patch, then run the project's targeted tests for that
    file in repo_path. If a test breaks, revert that one fix and record it as reverted.
    Match the project's conventions and do not refactor beyond the approved item.
    Do not commit. Record every item as applied, skipped or reverted with a reason.
  inputs:
  - approved_plan
  - repo_path
  outputs:
  - apply_log
  tools:
  - read_file
  - patch
  - terminal
  output_schema:
    type: object
    additionalProperties: false
    required:
    - apply_log
    properties:
      apply_log:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - file
          - status
          - reason
          properties:
            id:
              type: string
            file:
              type: string
            status:
              type: string
              enum:
              - applied
              - skipped
              - reverted
            reason:
              type: string
  checks:
  - schema
  - only_approved_items_touched
  - no_risky_item_applied
  on_fail:
    retry: 0
    then: stop
  next:
  - to: run_checks
- id: run_checks
  type: code
  goal: Run the project's test command and the repo's linter or type check, recording
    the exit codes.
  script: checks/run_checks.sh
  inputs:
  - repo_path
  - apply_log
  outputs:
  - test_result
  checks:
  - schema
  - exit_codes_recorded
  on_fail:
    retry: 0
    then: stop
  next:
  - to: report
- id: report
  type: code
  goal: Assemble the final summary grouped by reviewer tier, listing applied fixes,
    skipped findings, reverted fixes, bug notes and test results.
  script: checks/report.py
  inputs:
  - approved_plan
  - apply_log
  - test_result
  outputs:
  - final_report
  checks:
  - schema
  - every_skipped_item_has_reason
