name: youtube-content
version: 0.1
goal: Fetch a YouTube video's transcript with the youtube helper, turn it into the
  requested format (default summary), verify it, and return it. Stop with an explanation
  if any gate fails.
context_policy: fresh context per node; only the declared inputs are passed
inputs:
  video_url:
    type: string
    from: user
    description: YouTube URL in any standard form (watch, youtu.be, shorts, embed,
      live) or a raw 11-character video ID
  output_format:
    type: string
    from: user
    description: One of chapters, summary, chapter_summaries, thread, blog, quotes.
      Empty means summary.
  language:
    type: string
    from: user
    description: Comma-separated language fallback chain such as tr,en. Empty means
      any available transcript.
check_descriptions:
  url_is_youtube: The output gives an 11-character video_id extracted from the input,
    and url_valid is true only when that ID was found.
  user_approved: The approval_answer is an explicit yes to installing the youtube
    helper environment and fetching the transcript.
  import_check_passed: The terminal output shows the import check printed a youtube_transcript_api
    file path from the prepared Python interpreter.
  no_raw_pip: The terminal commands used only the activate script and pm.sync_venv,
    with no raw pip install and no project-discovering uv run.
  format_matches_request: The output is in the format named by output_format, or in
    summary format when output_format is empty.
  timestamps_match_source: Every timestamp in the output appears in the transcript
    text or chunk it was taken from, with no invented times.
  coherent_and_complete: The output reads as coherent prose or structure and covers
    the video from its first chunk to its last.
nodes:
- id: validate_url
  type: code
  goal: Extract the 11-character video ID from the URL or raw ID, and mark whether
    it is valid.
  script: checks/validate_url.py
  inputs:
  - video_url
  outputs:
  - video_id
  - url_valid
  checks:
  - schema
  - url_is_youtube
  next:
  - to: url_gate
- id: url_gate
  type: branch
  goal: Stop early if the URL is not a valid YouTube link or ID.
  'true': url_valid
  inputs:
  - url_valid
  outputs: []
  next:
  - to: ask_setup_approval
    label: url is valid
  - to: explain_failure
    label: any other value
- id: ask_setup_approval
  type: tool
  goal: Ask the user to approve installing the youtube helper environment and fetching
    the transcript for this video.
  tool: clarify
  inputs:
  - video_id
  outputs:
  - approval_answer
  checks:
  - non_empty
  - user_approved
  on_fail:
    retry: 0
    then: explain_failure
  next:
  - to: setup_gate
- id: setup_gate
  type: branch
  goal: Run setup and fetch only when the user explicitly approved.
  'true': approval_answer
  inputs:
  - approval_answer
  outputs: []
  next:
  - to: setup_and_fetch
    label: user explicitly approved
  - to: explain_failure
    label: anything else
- id: setup_and_fetch
  type: agent
  goal: Prepare the youtube helper Python environment, verify its import, and fetch
    the transcript as text with timestamps.
  instructions: 'Work from the Hermes source checkout. First follow the isolated development-home
    setup in the Package Management docs. Then run: source ./activate; python -c "import
    pm; pm.sync_venv([''youtube''], explicit=True)"; source ./activate; python -c
    "import youtube_transcript_api; print(youtube_transcript_api.__file__)". On Windows
    use . .\activate.ps1 instead. Run every later command with the interpreter whose
    import check succeeded. Never use raw pip or uv run. If a dependency is missing,
    repeat the preparation and reactivation, then verify again. Then run python SKILL_DIR/scripts/fetch_transcript.py
    with the video_id, --text-only --timestamps, and --language set to the language
    input when it is not empty. If the output is empty, rerun without --language.
    If it is still empty, set transcript_status to disabled. If the video is private
    or unavailable, set transcript_status to unavailable. Set transcript_status to
    ok when text was fetched. Do not write files.'
  tools:
  - terminal
  inputs:
  - video_id
  - language
  output_schema:
    type: object
    properties:
      transcript_text:
        type: string
      transcript_language:
        type: string
      transcript_status:
        type: string
        enum:
        - ok
        - empty
        - disabled
        - unavailable
    required:
    - transcript_text
    - transcript_language
    - transcript_status
    additionalProperties: false
  outputs:
  - transcript_text
  - transcript_language
  - transcript_status
  checks:
  - schema
  - grounded_in_tool_results
  - import_check_passed
  - no_raw_pip
  on_fail:
    retry: 1
    then: explain_failure
  next:
  - to: transcript_gate
- id: transcript_gate
  type: branch
  goal: Continue only when the transcript was fetched.
  'true': transcript_status
  inputs:
  - transcript_status
  outputs: []
  next:
  - to: chunk_transcript
    label: status is ok
  - to: explain_failure
    label: any other status
- id: chunk_transcript
  type: code
  goal: Split the transcript into chunks of about 40K characters with 2K overlap,
    or keep one chunk when it is under 50K characters.
  script: checks/chunk_transcript.py
  inputs:
  - transcript_text
  outputs:
  - chunks
  checks:
  - schema
  - non_empty
  next:
  - to: summarize_chunk
- id: summarize_chunk
  type: agent
  for_each: chunks
  goal: Summarize one transcript chunk and keep its timestamps.
  instructions: Summarize this chunk in plain prose and keep every timestamp it contains.
    If it is the only chunk, keep its full detail instead of summarizing.
  tools: []
  inputs:
  - item
  output_schema:
    type: object
    properties:
      chunk_notes:
        type: string
    required:
    - chunk_notes
    additionalProperties: false
  outputs:
  - chunk_notes
  checks:
  - schema
  - non_empty
  - timestamps_match_source
  on_fail:
    retry: 1
    then: explain_failure
  next:
  - to: transform
- id: transform
  type: agent
  goal: Turn the chunk notes into the requested output format.
  instructions: 'Format the content by output_format. chapters: timestamped topic
    list such as 00:00 Introduction, one line each. summary: 5-10 sentences for the
    whole video. chapter_summaries: chapters with a short paragraph each. thread:
    numbered posts, each under 280 characters. blog: title, sections, and key takeaways.
    quotes: notable quotes with timestamps. If output_format is empty, use summary.'
  tools: []
  inputs:
  - chunk_notes
  - output_format
  output_schema:
    type: object
    properties:
      formatted_output:
        type: string
    required:
    - formatted_output
    additionalProperties: false
  outputs:
  - formatted_output
  checks:
  - schema
  - non_empty
  - format_matches_request
  - timestamps_match_source
  on_fail:
    retry: 1
    then: explain_failure
  next:
  - to: verify_output
- id: verify_output
  type: agent
  goal: Re-read the formatted output for coherence, correct timestamps, and completeness
    before it is shown.
  instructions: Compare formatted_output with chunk_notes. Check that the flow is
    coherent, timestamps match the source, and the output covers the video from start
    to end. If a check fails, rewrite the output to fix it. Return the corrected text
    as final_output.
  tools: []
  inputs:
  - formatted_output
  - chunk_notes
  output_schema:
    type: object
    properties:
      final_output:
        type: string
    required:
    - final_output
    additionalProperties: false
  outputs:
  - final_output
  checks:
  - schema
  - non_empty
  - coherent_and_complete
  - timestamps_match_source
  on_fail:
    retry: 1
    then: explain_failure
  next:
  - to: deliver
- id: explain_failure
  type: agent
  goal: Tell the user which step stopped and why, in one short paragraph.
  instructions: Use only the inputs given. An empty input means that step did not
    run, so say it is unknown. If the URL is invalid, ask for a YouTube URL or 11-character
    video ID. If approval was not given, say the setup was not run. If transcript_status
    is disabled, suggest checking whether subtitles are available on the video page.
    If it is unavailable, ask the user to verify the URL because the video may be
    private. Return the message as final_output.
  tools: []
  inputs:
  - video_url
  - video_id
  - approval_answer
  - transcript_status
  output_schema:
    type: object
    properties:
      final_output:
        type: string
    required:
    - final_output
    additionalProperties: false
  outputs:
  - final_output
  checks:
  - schema
  - non_empty
  next:
  - to: deliver
- id: deliver
  type: code
  goal: Return the final output as the answer.
  script: checks/deliver.py
  inputs:
  - final_output
  outputs:
  - answer
  checks:
  - schema
  - non_empty
