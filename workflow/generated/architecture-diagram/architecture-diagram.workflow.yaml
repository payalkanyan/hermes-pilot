name: architecture-diagram
version: 0.1
goal: Generate a dark-themed, self-contained HTML file with inline SVG that renders
  a technical architecture diagram from the user's description of components and connections,
  then tell the user where it is saved.
context_policy: fresh context per node; only the declared inputs are passed
tools_provided:
- skill_view
inputs:
  architecture_description:
    type: string
    from: user
    description: Components, connections, technologies and any cloud or security boundaries
      of the system to diagram
  output_path:
    type: string
    from: user
    description: Where to save the .html file; defaults to ./[project-name]-architecture.html
      in the current directory if the user gives none
nodes:
- id: scope_check
  type: agent
  goal: Decide whether the subject is a software or infrastructure architecture that
    suits this skill, and extract its components and connections.
  instructions: Read the architecture_description. If the subject is scientific, physical-object,
    floor-plan, narrative, or hand-drawn, set in_scope to false and name a better
    tool (excalidraw, concept-diagrams, or an animation skill). Otherwise set in_scope
    to true and list each component with its type (frontend, backend, database, cloud,
    security, message bus, external) and each connection with its direction and whether
    it is a security flow. Use only what the description states; do not invent components.
  inputs:
  - architecture_description
  tools: []
  output_schema:
    type: object
    properties:
      in_scope:
        type: boolean
      reason:
        type: string
      components:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            type:
              type: string
              enum:
              - frontend
              - backend
              - database
              - cloud
              - security
              - message_bus
              - external
            sublabel:
              type: string
          required:
          - name
          - type
          - sublabel
          additionalProperties: false
      connections:
        type: array
        items:
          type: object
          properties:
            from:
              type: string
            to:
              type: string
            label:
              type: string
            security_flow:
              type: boolean
          required:
          - from
          - to
          - label
          - security_flow
          additionalProperties: false
      boundaries:
        type: array
        items:
          type: object
          properties:
            kind:
              type: string
              enum:
              - region
              - security_group
            label:
              type: string
            contains:
              type: array
              items:
                type: string
          required:
          - kind
          - label
          - contains
          additionalProperties: false
    required:
    - in_scope
    - reason
    - components
    - connections
    - boundaries
    additionalProperties: false
  outputs:
  - diagram_spec
  checks:
  - schema
  - non_empty
  - scope_is_in_scope
  on_fail:
    retry: 1
    then: stop
  next:
  - to: scope_branch
- id: scope_branch
  type: branch
  goal: Stop with a pointer to a better skill when the subject is out of scope, otherwise
    continue to layout.
  'true': diagram_spec
  inputs:
  - diagram_spec
  outputs:
  - in_scope_spec
  next:
  - to: plan_layout
    label: in_scope is true
  - to: report_out_of_scope
    label: any other value
- id: plan_layout
  type: agent
  goal: Lay out the components in a grid with boundaries, bus placement and a legend
    area that respects the spacing rules.
  instructions: Assign each component an x, y, width and height on a grid. Use 60px
    height for services and 80-120px for large components. Keep at least 40px vertical
    gap between components. Place message buses only in the gap between services,
    never overlapping them. Place each security group and region boundary around its
    contained components. Compute the lowest y of all boundaries and set legend_y
    at least 20px below it. Arrows must be drawn before boxes so they sit behind them.
  inputs:
  - in_scope_spec
  tools: []
  output_schema:
    type: object
    properties:
      nodes:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            x:
              type: number
            y:
              type: number
            width:
              type: number
            height:
              type: number
          required:
          - name
          - x
          - y
          - width
          - height
          additionalProperties: false
      legend_y:
        type: number
      canvas_width:
        type: number
      canvas_height:
        type: number
    required:
    - nodes
    - legend_y
    - canvas_width
    - canvas_height
    additionalProperties: false
  outputs:
  - layout
  checks:
  - schema
  - non_empty
  - no_overlapping_components
  - legend_below_boundaries
  - bus_in_gap_between_services
  on_fail:
    retry: 1
    then: stop
  next:
  - to: build_html
- id: build_html
  type: agent
  goal: Produce the complete single-file HTML with inline SVG, dark grid background,
    styled components, arrows, boundaries, legend and summary cards.
  instructions: 'Use the template structure from skill_view(name="architecture-diagram",
    file_path="templates/template.html"). Use JetBrains Mono from Google Fonts and
    no other external resources. Background is slate-950 #020617 with a 40px grid
    pattern. Use the semantic colour table: frontend rgba(8,51,68,0.4) stroke #22d3ee;
    backend rgba(6,78,59,0.4) stroke #34d399; database rgba(76,29,149,0.4) stroke
    #a78bfa; cloud rgba(120,53,15,0.3) stroke #fbbf24; security rgba(136,19,55,0.4)
    stroke #fb7185; message bus rgba(251,146,60,0.3) stroke #fb923c; external rgba(30,41,59,0.5)
    stroke #94a3b8. Components are rx=6 rounded rects with 1.5px strokes, drawn over
    an opaque #0f172a rect to mask arrows. Security flows are dashed rose #fb7185.
    Security groups are dashed 4,4 rose; regions are dashed 8,4 amber with rx=12.
    Font sizes: 12px names, 9px sublabels, 8px annotations, 7px tiny labels. Header
    has a CSS-pulsing dot, main SVG in a bordered card, three summary cards, then
    a footer. No JavaScript. Use only the layout from the previous step.'
  inputs:
  - layout
  - in_scope_spec
  tools:
  - skill_view
  output_schema:
    type: object
    properties:
      html:
        type: string
    required:
    - html
    additionalProperties: false
  outputs:
  - html_text
  checks:
  - schema
  - non_empty
  - no_javascript
  - no_external_resources_except_google_fonts
  - uses_semantic_colors
  - legend_outside_boundaries
  on_fail:
    retry: 1
    then: stop
  next:
  - to: resolve_path
- id: resolve_path
  type: code
  goal: Choose the output file path, using the user's path or the default ./[project-name]-architecture.html.
  script: checks/resolve_path.py
  inputs:
  - output_path
  - in_scope_spec
  outputs:
  - file_path
  checks:
  - schema
  - non_empty
  next:
  - to: confirm_write
- id: confirm_write
  type: branch
  goal: 'Gate the file write: continue only when the user approves the path and the
    HTML passed its checks.'
  'true': file_path
  inputs:
  - file_path
  - html_text
  outputs:
  - write_approved
  checks:
  - non_empty
  next:
  - to: write_diagram
    label: user approves the path
  - to: report_out_of_scope
    label: user declines
- id: write_diagram
  type: tool
  goal: Save the HTML to the approved path as one self-contained file.
  tool: write_file
  inputs:
  - file_path
  - html_text
  outputs:
  - saved_path
  checks:
  - schema
  - grounded_in_tool_results
  on_fail:
    retry: 0
    then: report_out_of_scope
  next:
  - to: report_saved
- id: report_saved
  type: code
  goal: Report the saved absolute path and the command to open it in a browser (open
    on macOS, xdg-open on Linux).
  script: checks/report_saved.py
  inputs:
  - saved_path
  outputs:
  - final_answer
  checks:
  - schema
  - non_empty
- id: report_out_of_scope
  type: code
  goal: Report why no diagram was written and which other skill to use.
  script: checks/report_out_of_scope.py
  inputs:
  - in_scope_spec
  outputs:
  - final_answer
  checks:
  - schema
  - non_empty
check_descriptions:
  scope_is_in_scope: The output's in_scope field is true, or the reason names a more
    specialized skill for the subject.
  no_overlapping_components: No two component rectangles in the layout intersect.
  legend_below_boundaries: legend_y is at least 20px greater than the largest y plus
    height of every boundary and component box.
  bus_in_gap_between_services: Each message bus rectangle lies in the vertical gap
    between services and overlaps none of them.
  no_javascript: The HTML contains no script tags or event-handler attributes.
  no_external_resources_except_google_fonts: The HTML loads no external URLs other
    than Google Fonts.
  uses_semantic_colors: Each component's fill and stroke match the semantic colour
    table for its type.
  legend_outside_boundaries: The legend block is positioned outside every boundary
    box.
