name: product-price-monitor
version: 0.1
goal: Set up a price watch on one exact item with a verified baseline, then on each
  tick fetch the price, suppress duplicate alerts, and alert only when the all-in
  condition is met.
context_policy: fresh context per node; only the declared inputs are passed
inputs:
  item_url:
    type: string
    from: user
    description: source URL of the exact product or listing
  variant:
    type: string
    from: user
    description: exact variant such as size, color, quantity, dates, room or cabin
  currency:
    type: string
    from: user
    description: ISO currency code for the alert, e.g. USD
  max_all_in_price:
    type: number
    from: user
    description: alert when the all-in total is at or below this amount
  cooldown_hours:
    type: number
    from: user
    description: minimum hours between repeat alerts for the same offer
  destination:
    type: string
    from: user
    description: where alerts are delivered
  cadence:
    type: string
    from: user
    description: schedule such as every 6h
nodes:
- id: build_contract
  type: code
  goal: Build the watch contract that pins the exact item, variant, currency, threshold,
    cooldown and destination.
  script: checks/build_contract.py
  inputs:
  - item_url
  - variant
  - currency
  - max_all_in_price
  - cooldown_hours
  - destination
  outputs:
  - contract
  checks:
  - schema
  - variant_nonempty
  - currency_is_iso_code
  - threshold_positive
  next:
  - to: fetch_baseline
- id: fetch_baseline
  type: agent
  goal: Fetch the source once and record a live baseline observation for the exact
    item contract.
  instructions: Call web_extract once on contract.source_url. Confirm the page shows
    the pinned variant. Copy base price, mandatory fees, taxes and shipping, all-in
    total, availability and terms exactly as shown, in source currency. Record the
    retrieval time in ISO 8601. If the fetch fails or the page is an error or wrong
    variant, set failed to true and leave numeric fields null. Never guess a number.
  inputs:
  - contract
  tools:
  - web_extract
  output_schema:
    type: object
    additionalProperties: false
    required:
    - source_url
    - retrieved_at
    - source_currency
    - base_price
    - mandatory_fees
    - taxes_and_shipping
    - all_in_total
    - availability
    - terms
    - failed
    properties:
      source_url:
        type: string
      retrieved_at:
        type: string
        description: ISO 8601 timestamp
      source_currency:
        type: string
      base_price:
        type:
        - number
        - 'null'
      mandatory_fees:
        type:
        - number
        - 'null'
      taxes_and_shipping:
        type:
        - number
        - 'null'
      all_in_total:
        type:
        - number
        - 'null'
      availability:
        type: string
      terms:
        type: string
      failed:
        type: boolean
  outputs:
  - baseline
  checks:
  - schema
  - grounded_in_tool_results
  - variant_matches_contract
  on_fail:
    retry: 1
    then: stop
  next:
  - to: approve_baseline
- id: approve_baseline
  type: branch
  goal: Show the contract and baseline to the user and wait for approval before anything
    is written or scheduled.
  true: approval
  inputs:
  - contract
  - baseline
  outputs:
  - approval
  next:
  - to: write_state
    label: user approves and baseline.failed is false
  - to: report_outcome
    label: user declines or baseline failed
- id: write_state
  type: tool
  goal: Write the watch contract and baseline to the state file under the price-watches
    directory.
  tool: write_file
  inputs:
  - contract
  - baseline
  outputs:
  - state_path
  checks:
  - schema
  - file_parses_as_json
  - contract_matches_state
  on_fail:
    retry: 0
    then: stop
  next:
  - to: create_schedule
- id: create_schedule
  type: tool
  goal: Create the recurring tick job that runs this watch at the requested cadence.
  tool: cronjob_manage
  inputs:
  - state_path
  - cadence
  - destination
  outputs:
  - job_id
  checks:
  - schema
  - job_listed_with_cadence
  on_fail:
    retry: 0
    then: stop
  next:
  - to: fetch_current
- id: fetch_current
  type: agent
  goal: Re-fetch the source for the tick and record one observation comparable to
    the baseline.
  instructions: Call web_extract once on contract.source_url for the pinned variant.
    Copy base price, fees, taxes and shipping, all-in total, availability and terms
    exactly, in source currency, with a retrieval timestamp. If the fetch fails or
    the page is an error page, set failed to true and leave numeric fields null. Never
    guess a number.
  inputs:
  - contract
  - state_path
  tools:
  - web_extract
  output_schema:
    type: object
    additionalProperties: false
    required:
    - source_url
    - retrieved_at
    - source_currency
    - base_price
    - mandatory_fees
    - taxes_and_shipping
    - all_in_total
    - availability
    - terms
    - failed
    properties:
      source_url:
        type: string
      retrieved_at:
        type: string
        description: ISO 8601 timestamp
      source_currency:
        type: string
      base_price:
        type:
        - number
        - 'null'
      mandatory_fees:
        type:
        - number
        - 'null'
      taxes_and_shipping:
        type:
        - number
        - 'null'
      all_in_total:
        type:
        - number
        - 'null'
      availability:
        type: string
      terms:
        type: string
      failed:
        type: boolean
  outputs:
  - observation
  checks:
  - schema
  - grounded_in_tool_results
  - variant_matches_contract
  on_fail:
    retry: 1
    then: stop
  next:
  - to: compare_observation
- id: compare_observation
  type: code
  goal: Compare the observation with the stored state and decide alert, silent or
    failed, deterministically.
  script: checks/compare_observation.py
  inputs:
  - observation
  - contract
  - state_path
  outputs:
  - decision
  - alert_payload
  - updated_state
  checks:
  - schema
  - deterministic_replay
  - no_overwrite_on_failed_fetch
  - same_offer_not_realerted_within_cooldown
  - currency_matches_contract
  next:
  - to: route_alert
- id: route_alert
  type: branch
  goal: Route to delivery only when the decision is alert; otherwise save state silently.
  true: decision
  inputs:
  - decision
  outputs:
  - route_result
  next:
  - to: deliver_alert
    label: decision is alert
  - to: save_state
    label: decision is silent or failed
- id: deliver_alert
  type: tool
  goal: Send the alert with all-in price, currency, availability, threshold, timestamp,
    source link and uncertainty.
  tool: send_message
  inputs:
  - alert_payload
  - destination
  outputs:
  - delivery
  checks:
  - schema
  - destination_matches_contract
  - payload_has_all_in_price_currency_timestamp_link
  - never_claims_reserved_inventory
  on_fail:
    retry: 0
    then: stop
  next:
  - to: save_state
- id: save_state
  type: tool
  goal: Save the last good observation and last alert fingerprint to the state file.
  tool: write_file
  inputs:
  - updated_state
  - state_path
  outputs:
  - saved_state
  checks:
  - schema
  - last_good_not_overwritten_by_error
  - file_parses_as_json
  on_fail:
    retry: 0
    then: stop
  next:
  - to: report_outcome
- id: report_outcome
  type: code
  goal: Produce the short final result for the run.
  script: checks/report_outcome.py
  inputs:
  - approval
  outputs:
  - result
  checks:
  - schema
